[project]
name = "readtheworld"
version = "0.1.0"
description = "R로 2025년 서울 지하철 승차 인원과 날씨의 관계를 시간대별로 분석한 과제"
readme = "README.md"
authors = [
    { name = "potato9j" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
]

[project.scripts]
readtheworld = "readtheworld:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
